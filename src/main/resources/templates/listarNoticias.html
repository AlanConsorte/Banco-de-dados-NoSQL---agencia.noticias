<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Notícias Cadastradas</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		body {
			background: linear-gradient(135deg, #000000, #1a0000);
			font-family: Arial, sans-serif;
			color: #fff;
		}

		.navbar {
			background: #000;
			box-shadow: 0 0 10px red;
		}

		.navbar-brand {
			color: #ff1a1a !important;
			font-weight: bold;
		}

		.nav-link {
			color: #fff !important;
		}

		.nav-link:hover {
			color: #ff1a1a !important;
		}

		.table-box {
			margin-top: 40px;
			background: #111;
			padding: 30px;
			border-radius: 15px;
			box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
		}

		h1 {
			color: #ff1a1a;
			text-align: center;
			margin-bottom: 20px;
			text-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
		}

		table {
			width: 100%;
			border-collapse: collapse;
		}

		th {
			background: #cc0000;
			padding: 12px;
			text-align: center;
		}

		td {
			background: #1a1a1a;
			padding: 10px;
			text-align: center;
			border-bottom: 1px solid #333;
		}

		tr:hover td {
			background: #330000;
		}

		a {
			text-decoration: none;
			font-weight: bold;
		}

		.remover {
			color: #ff4d4d;
		}

		.editar {
			color: #4dd2ff;
		}

		a:hover {
			color: #fff;
		}

		.btn-nova {
			margin-bottom: 15px;
			background: #cc0000;
			border: none;
		}

		.btn-nova:hover {
			background: #ff1a1a;
		}
	</style>

</head>

<body>

	<nav class="navbar navbar-expand-lg">
		<div class="container">
			<a class="navbar-brand" th:href="@{/}">📰 Portal de Notícias</a>

			<div class="navbar-nav ms-auto">

				<a class="nav-link" th:href="@{/}">voltar</a>
			</div>
		</div>

	</nav>

	<div class="container">
		<div class="table-box">

			<h1>Notícias cadastradas</h1>

			<a th:href="@{/cadastrarNoticia}" class="btn btn-nova">
				➕ Nova Notícia
			</a>

			<table>
				<tr>
					<th>ID</th>
					<th>Autor</th>
					<th>Título</th>
					<th>Assunto</th>
					<th>Conteúdo</th>
					<th>Remover</th>
					<th>Editar</th>
				</tr>

				<tr th:each="doc : ${noticias}">
					<td th:text="${doc.id}"></td>
					<td th:text="${doc.autor.nome}"></td>
					<td th:text="${doc.titulo}"></td>
					<td th:text="${doc.assunto}"></td>
					<td th:text="${doc.conteudo}"></td>

					<td>
						<a class="remover" th:href="@{removerNoticia(idDocumento=${doc.id})}">
							❌
						</a>
					</td>

					<td>
						<a class="editar" th:href="@{editarNoticia(idNoticia=${doc.id})}">
							✏️
						</a>
					</td>
				</tr>

			</table>

		</div>

	</div>

</body>

</html>
