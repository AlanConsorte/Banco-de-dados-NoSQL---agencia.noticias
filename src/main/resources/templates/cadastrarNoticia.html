<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cadastrar Notícia</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		body {
			background: linear-gradient(135deg, #000000, #1a0000);
			font-family: Arial, sans-serif;
			color: #fff;
		}

		.form-box {
			margin-top: 50px;
			background: #111;
			padding: 40px;
			border-radius: 15px;
			box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
		}

		h2 {
			color: #ff1a1a;
			margin-bottom: 20px;
			text-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
		}

		label {
			margin-top: 10px;
		}

		input,
		textarea,
		select {
			width: 100%;
			padding: 10px;
			margin-top: 5px;
			border-radius: 8px;
			border: none;
			background: #222;
			color: #fff;
		}

		input:focus,
		textarea:focus,
		select:focus {
			outline: none;
			box-shadow: 0 0 8px red;
		}

		.btn-submit {
			margin-top: 20px;
			background: #cc0000;
			border: none;
			padding: 12px;
			width: 100%;
			border-radius: 10px;
			font-size: 18px;
			transition: 0.3s;
		}

		.btn-submit:hover {
			background: #ff1a1a;
			transform: scale(1.05);
		}

		.voltar {
			display: block;
			margin-bottom: 20px;
			color: #ff1a1a;
			text-decoration: none;
		}
	</style>

</head>

<body>

	<div class="container">
		<div class="form-box">
			<a class="voltar" th:href="@{/}">⬅ Voltar</a>


			<h2>➕ Cadastrar Nova Notícia</h2>

			<form method="POST" th:action="@{/cadastrarNoticias}">

				<label>Autor:</label>
				<select name="autor.id" required>
					<option value="" disabled selected>Selecione um autor cadastrado</option>
					<option th:each="autor : ${autores}" th:value="${autor.id}" th:text="${autor.nome + ' - ' + autor.email}"></option>
				</select>

				<label>Data de Criação:</label>
				<input type="date" name="dataCriacao" />

				<label>Título:</label>
				<input type="text" name="titulo" />

				<label>Assunto:</label>
				<textarea name="assunto" rows="3"></textarea>

				<label>Conteúdo da notícia:</label>
				<textarea name="conteudo" rows="10"></textarea>

				<input type="submit" value="Cadastrar" class="btn-submit" />

			</form>
		</div>

	</div>

</body>

</html>
