<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cadastrar Assunto</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		body {
			background: linear-gradient(135deg, #000000, #1a0000);
			font-family: Arial, sans-serif;
			color: #fff;
		}

		.form-box {
			margin-top: 50px;
			background: #111;
			padding: 40px;
			border-radius: 15px;
			box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
		}

		h2 {
			color: #ff1a1a;
			margin-bottom: 20px;
			text-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
		}

		label {
			margin-top: 10px;
		}

		input {
			width: 100%;
			padding: 10px;
			margin-top: 5px;
			border-radius: 8px;
			border: none;
			background: #222;
			color: #fff;
		}

		input:focus {
			outline: none;
			box-shadow: 0 0 8px red;
		}

		.btn-submit {
			margin-top: 25px;
			background: #cc0000;
			border: none;
			padding: 12px;
			width: 100%;
			border-radius: 10px;
			font-size: 18px;
			transition: 0.3s;
		}

		.btn-submit:hover {
			background: #ff1a1a;
			transform: scale(1.05);
		}

		.voltar {
			display: block;
			margin-bottom: 20px;
			color: #ff1a1a;
			text-decoration: none;
		}
	</style>

</head>

<body>

	<div class="container">
		<div class="form-box">
			<a class="voltar" th:href="@{/}">⬅ Voltar</a>

			<h2>📝 Cadastrar Assunto</h2>

			<form th:action="@{/ReceberFormularioCadastrarAssunto}" method="POST" th:object="${assunto}">

				<label>Nome do assunto:</label>
				<input type="text" th:field="*{nomeAssunto}" placeholder="Digite o nome do assunto" required />

				<input type="submit" value="Cadastrar Assunto" class="btn-submit" />

			</form>
		</div>
	</div>

</body>
</html>
