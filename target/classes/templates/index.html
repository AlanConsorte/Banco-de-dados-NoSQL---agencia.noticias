<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Portal de Notícias</title>

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		body {
			background: linear-gradient(135deg, #000000, #1a0000);
			font-family: Arial, sans-serif;
			color: #fff;
		}

		.container-box {
			margin-top: 100px;
			background: #111;
			padding: 40px;
			border-radius: 15px;
			box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
			text-align: center;
		}

		h1 {
			margin-bottom: 30px;
			color: #ff1a1a;
			font-weight: bold;
			text-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
		}

		.btn-custom {
			width: 100%;
			margin-bottom: 20px;
			font-size: 18px;
			padding: 15px;
			border-radius: 10px;
			transition: 0.3s;
		}

		.btn-primary {
			background-color: #cc0000;
			border: none;
		}

		.btn-primary:hover {
			background-color: #ff1a1a;
			transform: scale(1.05);
		}

		.btn-success {
			background-color: #330000;
			border: 1px solid #ff1a1a;
		}

		.btn-success:hover {
			background-color: #660000;
			transform: scale(1.05);
		}
	</style>
	<meta charset="UTF-8">
	<title>Agencia de Notícias Web</title>
</head>

<body>

	<div class="container">
		<div class="container-box">
			<h1>📰 Portal de Notícias</h1>

			<a href="cadastrarNoticia" class="btn btn-primary btn-custom">
				➕ Cadastrar nova notícia
			</a>

			<a href="listarNoticias" class="btn btn-success btn-custom">
				📋 Listar notícias
			</a>

		</div>
	</div>

</body>

</html>
