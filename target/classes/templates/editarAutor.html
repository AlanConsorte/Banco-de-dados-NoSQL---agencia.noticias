<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Editar Autor</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		body {
			background: linear-gradient(135deg, #000000, #1a0000);
			font-family: Arial, sans-serif;
			color: #fff;
		}

		.navbar {
			background: #000;
			box-shadow: 0 0 10px red;
		}

		.navbar-brand {
			color: #ff1a1a !important;
			font-weight: bold;
		}

		.nav-link {
			color: #fff !important;
		}

		.nav-link:hover {
			color: #ff1a1a !important;
		}

		.form-box {
			margin-top: 40px;
			background: #111;
			padding: 40px;
			border-radius: 15px;
			box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
		}

		h1 {
			color: #ff1a1a;
			margin-bottom: 20px;
			text-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
		}

		label {
			margin-top: 10px;
		}

		input {
			width: 100%;
			padding: 10px;
			margin-top: 5px;
			border-radius: 8px;
			border: none;
			background: #222;
			color: #fff;
		}

		input:focus {
			outline: none;
			box-shadow: 0 0 8px red;
		}

		.btn-submit {
			margin-top: 20px;
			background: #cc0000;
			border: none;
			padding: 12px;
			width: 100%;
			border-radius: 10px;
			font-size: 18px;
			transition: 0.3s;
		}

		.btn-submit:hover {
			background: #ff1a1a;
			transform: scale(1.05);
		}

		.btn-voltar {
			margin-bottom: 15px;
			display: inline-block;
			color: #ff1a1a;
			text-decoration: none;
		}
	</style>

</head>

<body>


	<nav class="navbar navbar-expand-lg">
		<div class="container">
			<a class="navbar-brand" th:href="@{/index}">📰 Portal de Notícias</a>

			<div class="navbar-nav ms-auto">
				<a class="nav-link" th:href="@{/cadastrarAutor}">Cadastrar</a>
				<a class="nav-link" th:href="@{/listarAutores}">Listar</a>
			</div>
		</div>

	</nav>


	<div class="container">
		<div class="form-box">

			<a th:href="@{/listarAutores}" class="btn-voltar">⬅ Voltar</a>

			<h1>✏️ Editar autor</h1>

			<form method="POST" th:action="@{editarAutor}">

				<input type="hidden" name="id" th:value="${autor.id}">

				<label>Nome do autor:</label>
				<input type="text" name="nome" th:value="${autor.nome}" />

				<label>E-mail:</label>
				<input type="email" name="email" th:value="${autor.email}" />

				<label>Data de nascimento:</label>
				<input type="date" name="dataNascimento" th:value="${autor.dataNascimento}" />

				<input type="submit" value="Salvar Alterações" class="btn-submit" />

			</form>

		</div>

	</div>

</body>

</html>
